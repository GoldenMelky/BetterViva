<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a31b13">
  <title>BetterViva</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BetterViva">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">BetterViva</span>
      <span id="sync-status" class="sync-status" role="status" aria-live="polite">Aggiornamento…</span>
    </div>
    <button id="settings-button" class="header-button" type="button" hidden aria-label="Impostazioni" title="Impostazioni">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="feedback-button" class="header-button" type="button" hidden aria-label="Invia un feedback" title="Invia un feedback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
    </button>
    <button id="avatar" class="avatar" hidden aria-label="Esci" title="Esci"></button>
    <button id="back-button" class="header-button" type="button" hidden aria-label="Indietro" title="Indietro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="menu-button" class="menu-button" type="button" aria-expanded="false" aria-controls="app-menu" aria-label="Apri menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <div id="connection-toast" class="connection-toast" role="status" aria-live="polite" hidden></div>
  <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
    <form id="feedback-form">
      <h2 id="feedback-title">Invia un feedback</h2>
      <p class="feedback-hint">Il messaggio sarà inviato allo sviluppatore. Non includere dati personali.</p>
      <label for="feedback-message">Il tuo messaggio</label>
      <textarea id="feedback-message" name="message" rows="5" maxlength="2000" required></textarea>
      <p id="feedback-status" class="feedback-status" role="status" aria-live="polite"></p>
      <div class="feedback-actions">
        <button id="feedback-close" class="secondary" type="button">Chiudi</button>
        <button id="feedback-send" class="primary" type="submit">Invia</button>
      </div>
    </form>
  </dialog>

  <nav id="app-menu" class="app-menu" hidden aria-label="Navigazione">
    <button id="menu-home" type="button">Home</button>
    <button id="menu-grades" type="button">Voti</button>
    <button id="menu-settings" type="button">Impostazioni</button>
  </nav>
  <main>
    <!-- Accesso -->
    <section id="view-login" hidden>
      <h1>Accedi con ClasseViva</h1>
      <form id="login-form" class="card">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label class="check">
          <input id="remember" type="checkbox" checked>
          <span>Resta connesso su questo dispositivo</span>
        </label>
        <p class="hint">Le credenziali restano cifrate in questo browser. Il server non le salva.</p>

        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-btn" type="submit">Accedi</button>
      </form>
    </section>

    <!-- Setup iniziale: benvenuto, materie, orario (un giorno per volta) -->
    <section id="view-setup" hidden>
      <div id="setup-body"></div>
    </section>

    <section id="view-settings" hidden>
      <div id="settings-body"></div>
    </section>

    <section id="view-grades" hidden aria-label="Voti">
      <div id="grades-body"></div>
    </section>

    <!-- Home: giorni (scorrono) + eventi del giorno (scorrono insieme) -->
    <section id="view-home" hidden>
      <div class="daybar">
        <div id="days" class="days" aria-label="Giorni"></div>
        <button id="today-button" class="today-button" type="button">Oggi</button>
        <button id="mode-toggle" class="mode-toggle" type="button" role="switch" aria-checked="false" data-mode="orario" aria-label="Vista eventi" title="Cambia vista">
          <span class="knob">
            <svg class="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <svg class="i-events" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M14 3l5 5v2"/><path d="M20.3 12.7l-6.6 6.6-2.7.7.7-2.7 6.6-6.6a1.4 1.4 0 0 1 2 2z"/></svg>
          </span>
        </button>
      </div>
      <div id="panels" class="panels"></div>
      <div id="evlist" class="evlist" hidden></div>

      <!-- Calendario annuale: usa gli stessi eventi della home -->
      <section id="cal" class="cal" aria-labelledby="cal-title" hidden>
        <h2 id="cal-title">Verifiche e interrogazioni</h2>
        <div class="cal-month-nav" aria-label="Navigazione mesi">
          <button id="cal-prev" class="cal-month-arrow" type="button" aria-label="Mese precedente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <h3 id="cal-month-title" aria-live="polite"></h3>
          <button id="cal-next" class="cal-month-arrow" type="button" aria-label="Mese successivo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="cal-week" aria-hidden="true">
          <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span>
        </div>
        <div id="cal-scroll" class="cal-scroll" tabindex="0" aria-label="Calendario dell'anno scolastico">
          <div id="cal-months"></div>
        </div>
      </section>
    </section>

    <p id="status" class="status">Caricamento…</p>
  </main>

  <script src="/static/sheet.js"></script>
  <script src="/static/calendar.js"></script>
  <script src="/static/home.js"></script>
  <script src="/static/grades.js"></script>
  <script src="/static/setup.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
