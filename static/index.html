<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BetterViva</title>
<link rel="icon" href="/static/icons/icon-192.png" type="image/png" />
<link rel="stylesheet" href="/static/concept.css" />
</head>
<body>
<div class="app" id="app" data-screen="home">
  <header>
    <div class="top">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 4h7a4 4 0 0 1 1.6 7.67A4.5 4.5 0 0 1 13.5 20H6z" fill="#c4251c"/><path d="m9 12.5 2 2 4-4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand">
        <h1>Better<span>Viva</span></h1>
        <p><i aria-hidden="true"></i><span id="sub">Aggiornamento…</span></p>
      </div>
      <button class="icon-btn" data-sheet="feedback" aria-label="Invia feedback">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="icon-btn" data-sheet="notifiche" aria-label="Novità">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" aria-hidden="true" hidden></span>
      </button>
      <button class="avatar" aria-label="Profilo">BV</button>
    </div>
    <div class="seg" id="seg" data-view="orario" role="tablist" aria-label="Vista">
      <span class="pill" aria-hidden="true"></span>
      <button role="tab" aria-selected="true" data-view="orario" aria-controls="view-orario">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Orario
      </button>
      <button role="tab" aria-selected="false" data-view="eventi" aria-controls="view-eventi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Eventi
      </button>
    </div>
  </header>

  <div class="views">
    <section class="view" id="view-orario" role="tabpanel" aria-label="Orario">
      <div class="chips" id="chips" role="tablist" aria-label="Giorni"></div>
      <div class="pager" id="pager"></div>
    </section>
    <section class="view" id="view-eventi" role="tabpanel" aria-label="Eventi" hidden>
      <div class="ev-scroll" id="evScroll">
        <div class="filters" id="filters"></div>
        <div class="cal" id="cal"></div>
        <div id="groups"></div>
      </div>
    </section>
    <section class="view" id="view-voti" role="tabpanel" aria-label="Voti" hidden>
      <div class="vpane" id="vOverview"><div class="vscroll" id="vOvScroll"></div></div>
      <div class="vpane" id="vDetail" hidden>
        <div class="strip" id="strip" role="tablist" aria-label="Materie"></div>
        <div class="pager" id="vPager"></div>
      </div>
    </section>
    <section class="view" id="view-stub" role="tabpanel" aria-label="Sezione" hidden><div class="stub" id="stub"></div></section>
  </div>

  <button class="fab" data-sheet="menu" aria-label="Apri menu" aria-haspopup="dialog">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<script src="/static/concept-bootstrap.js"></script>
  <script src="/static/sheet.js"></script>
  <script src="/static/calendar.js"></script>
  <script src="/static/home.js"></script>
  <script src="/static/grades.js"></script>
  <script src="/static/noticeboard.js"></script>
  <script src="/static/setup.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/notifications.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/concept-app.js"></script>
  <script src="/static/pwa.js"></script>
</body>
</html>
